name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both tools are pinned so that CI and local runs agree; an unpinned
      # shellcheck changes which warnings fire and fails on unrelated PRs.
      - name: Install shellcheck and shfmt
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHFMT_VERSION: v3.8.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /usr/local/bin/shfmt
          shellcheck --version | grep version:
          shfmt --version

      - name: shellcheck
        run: make lint

      - name: shfmt
        run: make fmt-check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS covers bash 3.2, which is the oldest bash git-wt supports.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Show bash version
        run: bash --version

      - name: Run tests
        run: make test

  install:
    name: Install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install to a temporary prefix
        run: make install PREFIX="$RUNNER_TEMP/prefix"

      - name: Run the installed command as a git subcommand
        run: |
          export PATH="$RUNNER_TEMP/prefix/bin:$PATH"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git wt version
          mkdir -p "$RUNNER_TEMP/repo" && cd "$RUNNER_TEMP/repo"
          git init --quiet --initial-branch=main .
          git commit --quiet --allow-empty -m init
          path=$(git wt create smoke/test)
          test -d "$path" || { echo "worktree not created at $path" >&2; exit 1; }
          git wt list
          git wt delete smoke/test
          echo "✓ install smoke test passed"
